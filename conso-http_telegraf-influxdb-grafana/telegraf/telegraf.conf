[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = ""
  debug = true
  quiet = false
  logfile = ""
  logtarget = "stderr"

[[inputs.http_listener_v2]]
  service_address = ":8186"
  paths = ["/logs"]
  methods = ["POST"]
  data_format = "json"

  tag_keys = ["badge_id", "zone", "status", "device_id"]
  json_string_fields = ["badge_id", "zone", "status", "device_id"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "my-token"
  organization = "usine-org"
  bucket = "access_logs"